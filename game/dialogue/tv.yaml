    speaker: tv_judge_trudy
    text: "You borrowed his truck, you brought it back with no muffler. Pay the man."
    context: "Judge Trudy, any day before broadcasts end."
    status: draft

  - id: tv.morty.seg1
    speaker: tv_host_morty
    text: "The lie detector test determined... that was a lie."
    context: "The Morty Show."
    status: draft

  - id: tv.emergency.loop
    speaker: tv_emergency
    text: "This is an emergency alert for southeastern New Brunswick. Stay indoors. Lock your doors. Do not approach anyone showing signs of illness."
    context: "Emergency broadcast, from day 3."
